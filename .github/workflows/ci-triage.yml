# This repository triages its own failed CI runs with ci-triage.
name: ci-triage

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write
  pull-requests: write
  issues: write
  contents: read

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
