[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-triage"
version = "1.0.0"
description = "Reads a failed CI run, says what kind of failure it is (flaky test, real failure, lint, dependency, infrastructure...) and what to do, with Jev."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
ci-triage = "ci_triage.cli:main"

[tool.setuptools]
packages = ["ci_triage", "ci_triage.backends"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "SIM", "RUF", "PL"]
ignore = ["E501", "S101", "RUF001", "RUF002", "RUF003", "PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "PLR0914", "PLR0917", "PLC0415", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "BLE", "SLF001", "PLC0415", "S105", "S106"]
"ci_triage/cli.py" = ["T201"]
"scripts/*" = ["T201", "S603", "S607", "E402"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_generics = false
warn_return_any = false
exclude = ["tests/", "build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
